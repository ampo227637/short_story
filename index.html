<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="The Two Castles — A Queenie & Ricky Love Story" />
  <title>The Two Castles — Queenie & Ricky ❤️</title>

  <style>
    :root {
      --night: #0b0b2b;
      --royal: #2b0b3d;
      --gold: #ffd77a;
      --pink: #ff9ec7;
      --soft-pink: #f5b8d8;
      --white: #ffffff;
      --muted: #dfd5e5;
      --glass: rgba(255, 255, 255, 0.075);
      --gold-border: rgba(255, 215, 122, 0.50);
      --gold-glow: rgba(255, 200, 100, 0.25);
      --blue: #3f7cff;
      --purple: #8b5cf6;
      --card-radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--night);
    }

    body {
      color: var(--white);
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(
          180deg,
          #0b0b2b 0%,
          #17103b 45%,
          #2b0b3d 100%
        );
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    /* Background layers */
    #stars,
    #hearts,
    #shootingStars,
    #burst {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #stars {
      z-index: 0;
    }

    #hearts {
      z-index: 1;
    }

    #shootingStars {
      z-index: 2;
    }

    #burst {
      z-index: 60;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--white);
      opacity: 0.4;
      animation: twinkle var(--duration) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.12;
        transform: scale(0.7);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.35);
      }
    }

    .heart {
      position: absolute;
      bottom: -50px;
      left: var(--left);
      font-size: var(--size);
      opacity: 0;
      animation: riseHeart var(--duration) linear forwards;
      filter: drop-shadow(0 0 10px rgba(255, 158, 199, 0.25));
    }

    @keyframes riseHeart {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.72;
      }
      85% {
        opacity: 0.55;
      }
      100% {
        transform: translate3d(var(--drift), -115vh, 0) rotate(24deg);
        opacity: 0;
      }
    }

    .shooting-star {
      position: absolute;
      width: 120px;
      height: 2px;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
      box-shadow: 0 0 12px rgba(255,255,255,.65);
      transform: rotate(-27deg);
      animation: shoot 1.5s ease-out forwards;
    }

    @keyframes shoot {
      from {
        transform: translate3d(0, 0, 0) rotate(-27deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        transform: translate3d(-360px, 360px, 0) rotate(-27deg);
        opacity: 0;
      }
    }

    /* Top UI */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding:
        max(14px, env(safe-area-inset-top) + 8px)
        16px 12px;
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      color: rgba(255,255,255,.78);
      font-size: 12px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255,255,255,.14);
    }

    .brand span {
      color: var(--gold);
    }

    .sound-btn {
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 8px 12px;
      color: rgba(255,255,255,.88);
      background: rgba(11,11,43,.48);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform .25s ease, background .25s ease;
    }

    .sound-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.09);
    }

    .progress {
      position: fixed;
      top: 57px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(11, 11, 43, 0.34);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .progress-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      transition: width .35s ease, background .35s ease;
    }

    .progress-dot.active {
      width: 24px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--gold), var(--pink));
      box-shadow: 0 0 12px rgba(255, 215, 122, .28);
    }

    /* Page system */
    .pages {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .page {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding:
        max(92px, env(safe-area-inset-top) + 84px)
        18px
        max(82px, env(safe-area-inset-bottom) + 76px);
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .page.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .page-content {
      width: min(720px, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .story-card {
      width: 100%;
      min-height: 500px;
      max-height: calc(100svh - 175px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 30px;
      border-radius: var(--card-radius);
      border: 1px solid var(--gold-border);
      background: var(--glass);
      box-shadow:
        0 0 60px var(--gold-glow),
        inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .scene {
      font-size: clamp(40px, 8vw, 64px);
      line-height: 1;
      letter-spacing: 0.07em;
      margin-bottom: 15px;
      animation: floatScene 3s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(255, 215, 122, .18));
    }

    @keyframes floatScene {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .chapter-kicker {
      margin-bottom: 9px;
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      max-width: 650px;
      color: var(--white);
      font-size: clamp(31px, 6vw, 48px);
      line-height: 1.12;
      text-wrap: balance;
      text-shadow: 0 0 22px rgba(255,255,255,.07);
    }

    .subtitle {
      margin: 10px 0 20px;
      color: var(--soft-pink);
      font-size: clamp(15px, 3vw, 18px);
      font-style: italic;
    }

    .story-body {
      width: 100%;
      max-width: 635px;
      color: rgba(255,255,255,.9);
      font-size: clamp(16px, 2.8vw, 19px);
      line-height: 1.84;
      text-align: left;
    }

    .story-body p {
      margin: 0 0 12px;
    }

    .story-body strong {
      color: #fff4fb;
    }

    .god-box {
      width: 100%;
      max-width: 635px;
      margin-top: 15px;
      padding: 15px 18px;
      text-align: center;
      border: 1px solid rgba(255, 215, 122, .33);
      border-radius: 15px;
      background: rgba(255, 215, 122, .08);
      box-shadow: inset 0 0 22px rgba(255,215,122,.04);
    }

    .god-box .label {
      margin-bottom: 5px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: bold;
    }

    .god-quote {
      color: #fff4d6;
      font-size: clamp(15px, 2.8vw, 18px);
      font-style: italic;
      line-height: 1.55;
    }

    .closing {
      width: 100%;
      max-width: 635px;
      margin-top: 13px;
      color: var(--gold);
      font-size: clamp(17px, 3vw, 21px);
      font-weight: bold;
      text-align: center;
    }

    /* Navigation */
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding:
        12px 18px
        max(12px, env(safe-area-inset-bottom) + 8px);
      pointer-events: none;
    }

    .nav-inner {
      width: min(760px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-btn {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50px;
      padding: 11px 18px;
      color: #fff4fb;
      background: rgba(11,11,43,.54);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform .3s ease, background .3s ease, opacity .3s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.09);
    }

    .nav-btn.primary {
      color: #26152a;
      border-color: transparent;
      background: linear-gradient(135deg, var(--gold), var(--pink));
      box-shadow: 0 0 26px rgba(255, 215, 122, .18);
      font-weight: bold;
    }

    .nav-btn:disabled {
      opacity: .28;
      cursor: default;
      transform: none;
    }

    .page-label {
      color: rgba(255,255,255,.58);
      font-size: 12px;
      white-space: nowrap;
    }

    /* Final buttons */
    .final-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 23px;
    }

    .call-btn,
    .restart-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 175px;
      padding: 13px 20px;
      border-radius: 50px;
      font-weight: bold;
      transition: transform .3s ease, filter .3s ease;
    }

    .call-btn {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 0 26px rgba(83, 92, 255, .36);
      animation: callPulse 1.8s ease-in-out infinite;
    }

    @keyframes callPulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(83, 92, 255, .24);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 42px rgba(139, 92, 246, .55);
        transform: scale(1.025);
      }
    }

    .call-btn:hover,
    .restart-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.07);
    }

    .restart-btn {
      color: #2c1a28;
      background: linear-gradient(135deg, #fff2b7, #f5b8d8);
      border: none;
    }

    .tap-note {
      margin-top: 12px;
      color: rgba(255,255,255,.5);
      font-size: 11px;
    }

    .type-target {
      min-height: 1em;
    }

    /* Celebration burst */
    .burst-piece {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 20px;
      animation: burst 1.35s ease-out forwards;
    }

    @keyframes burst {
      from {
        transform: translate(-50%, -50%) scale(.3);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      to {
        transform:
          translate(
            calc(-50% + var(--dx)),
            calc(-50% + var(--dy))
          )
          rotate(var(--rotate))
          scale(1.1);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .story-card {
        min-height: 0;
        max-height: calc(100svh - 155px);
        padding: 28px 18px;
      }

      .scene {
        font-size: 2rem;
      }

      .title {
        font-size: 29px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 15px;
      }

      .story-body {
        font-size: 15px;
        line-height: 1.72;
      }

      .god-box {
        margin-top: 10px;
        padding: 12px 14px;
      }

      .god-quote {
        font-size: 14px;
      }

      .nav-btn {
        padding: 10px 13px;
        font-size: 14px;
      }

      .page-label {
        font-size: 10px;
      }

      .final-actions {
        flex-direction: column;
        width: 100%;
      }

      .call-btn,
      .restart-btn {
        width: 100%;
      }
    }

    @media (max-height: 700px) {
      .progress {
        top: 49px;
      }

      .story-card {
        padding-top: 24px;
        padding-bottom: 24px;
      }

      .scene {
        font-size: 2.3rem;
      }

      .story-body {
        line-height: 1.55;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="stars"></div>
    <div id="hearts"></div>
    <div id="shootingStars"></div>
    <div id="burst"></div>

    <div class="topbar">
      <div class="brand"><span>♥</span> The Two Castles</div>
      <button class="sound-btn" id="soundBtn" type="button">♪ Sound</button>
    </div>

    <div class="progress" id="progress"></div>

    <main class="pages" id="pages"></main>

    <nav class="nav" aria-label="Story navigation">
      <div class="nav-inner">
        <button class="nav-btn" id="prevBtn" type="button">← Back</button>
        <div class="page-label" id="pageLabel">Chapter 1 of 6</div>
        <button class="nav-btn primary" id="nextBtn" type="button">Next Chapter →</button>
      </div>
    </nav>
  </div>

  <script>
    /* =========================================================
       STORY DATA — EXACT CONTENT FROM THE PROVIDED INSTRUCTIONS
       ========================================================= */

    const chapters = [
      {
        scene: "🏰☀️📜",
        title: "The Prince in the Sun Castle",
        subtitle: "Where a lonely heart writes his first letter...",
        body: [
          `Once upon a time, in a castle that touched the morning sun, there lived a young prince named <strong>Ricky</strong>.`,
          `Every night, he would climb the tallest tower, look at the moon, and wonder... <em>"Is there someone out there, waiting for me?"</em>`,
          `One evening, he wrote a letter to a princess he had never met — a princess named <strong>Queenie</strong>. He sealed it with starlight and sent it into the sky.`
        ],
        quote: `“Distance means so little, when someone means so much.”`,
        closing: ""
      },
      {
        scene: "🌙🏰💌",
        title: "The Princess in the Moon Castle",
        subtitle: "Where a letter arrives on silver wings...",
        body: [
          `Far away, in a castle made of moonlight, a princess named <strong>Queenie</strong> sat by her window.`,
          `A messenger bird landed softly on her sill, carrying a glowing letter. She opened it with trembling hands.`,
          `The letter simply said: <em>"You are the reason my castle feels less empty."</em>`,
          `She smiled, and for the first time, her heart whispered back: <strong>"Bal..."</strong>`
        ],
        quote: `“Two souls don't find each other by simple accident.”`,
        closing: ""
      },
      {
        scene: "🌌🌉💫",
        title: "The Bridge of Stars",
        subtitle: "Where words become something stronger...",
        body: [
          `Night after night, they wrote to each other. Every letter was a stone. Every reply was a beam.`,
          `Slowly, a <strong>bridge of stars</strong> began to form between their castles — a bridge built not of wood, but of <strong>words, laughs, and 3 AM talks</strong>.`,
          `They called each other <strong>"Bal"</strong>. It wasn't a name. It was a home.`
        ],
        quote: `“Maybe home isn't a place. Maybe home is a person you haven't met yet.”`,
        closing: ""
      },
      {
        scene: "📞💫💖",
        title: "The Call Across Kingdoms",
        subtitle: "Where magic finally connects two hearts...",
        body: [
          `One night, the stars whispered a secret to Queenie: <em>"You don't have to wait for the bird. You can call him, right now."</em>`,
          `A glowing button appeared before her — warm, pulsing, alive. It whispered: <strong>"Press me, and the distance disappears."</strong>`,
          `She reached out her hand...`
        ],
        quote: `“Some connections don't need a road. They just need a touch.”`,
        closing: ""
      },
      {
        scene: "👑💖👑",
        title: "Forever, Bal",
        subtitle: "Where the story never really ends...",
        body: [
          `And so, the prince and the princess never truly closed the distance — because <strong>they never really were apart</strong>.`,
          `Queenie — my Bal — you are my favorite chapter. You are the reason I believe in magic, in letters, in castles, in forever.`,
          `One day, we'll meet. And on that day, this story will have its <strong>happiest ending</strong> — a beginning, really.`
        ],
        quote: `“I loved you in every chapter, and I'll love you in every sequel.”`,
        closing: `💌 Always yours, Bal.`
      },
      {
        scene: "🎁💖🌟",
        title: "The Final Surprise",
        subtitle: "The secret behind every chapter...",
        body: [
          `🎉 <strong>My dearest Bal,</strong>`,
          `If you've reached this chapter, it means you walked through every castle, every star, every word I wrote for you.`,
          `Here's the secret I've been hiding: <strong>this whole story was a love letter.</strong> Every chapter, every quote, every floating heart — they all point to one truth:`,
          `I haven't met you yet. But I already know — <strong>you're my favorite person I've never hugged.</strong>`,
          `Tap the button below. Let's close the distance, one message at a time.`
        ],
        quote: `“Out of all the princesses in all the castles in all the world... you walked into mine.” 💖`,
        closing: ""
      }
    ];

    let current = Number(localStorage.getItem("queenieRickyChapter") || 0);
    if (!Number.isInteger(current) || current < 0 || current >= chapters.length) {
      current = 0;
    }

    const pages = document.getElementById("pages");
    const progress = document.getElementById("progress");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageLabel = document.getElementById("pageLabel");
    const soundBtn = document.getElementById("soundBtn");
    const stars = document.getElementById("stars");
    const hearts = document.getElementById("hearts");
    const shootingStars = document.getElementById("shootingStars");
    const burst = document.getElementById("burst");

    /* =========================================================
       BUILD 120+ STARS
       ========================================================= */

    for (let i = 0; i < 140; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty("--duration", `${2.3 + Math.random() * 4.8}s`);
      star.style.animationDelay = `${Math.random() * 4.5}s`;
      stars.appendChild(star);
    }

    /* =========================================================
       CHAPTER PAGE RENDERING
       ========================================================= */

    function renderChapter(i) {
      const chapter = chapters[i];
      const page = document.createElement("section");
      page.className = "page";
      page.dataset.index = String(i);

      const body = chapter.body
        .map((paragraph, index) => `<p class="type-target" data-type="${index}">${paragraph}</p>`)
        .join("");

      const finalActions = i === chapters.length - 1
        ? `
          <div class="final-actions">
            <a
              class="call-btn"
              href="https://m.me/rickyoceballosampo"
              target="_blank"
              rel="noopener noreferrer"
              id="callRicky"
            >📞 Call Ricky Now</a>

            <button class="restart-btn" type="button" id="readAgain">🔁 Read Again</button>
          </div>
          <div class="tap-note">Open the next chapter with the button below, or use the glowing blue/purple button above.</div>
        `
        : "";

      page.innerHTML = `
        <div class="page-content">
          <article class="story-card">
            <div class="scene" aria-hidden="true">${chapter.scene}</div>
            <div class="chapter-kicker">Chapter ${i + 1}</div>
            <h1 class="title">${chapter.title}</h1>
            <div class="subtitle">${chapter.subtitle}</div>

            <div class="story-body" id="storyBody">
              ${body}
            </div>

            <div class="god-box">
              <div class="label">A Godly Quote</div>
              <div class="god-quote">${chapter.quote}</div>
            </div>

            ${chapter.closing ? `<div class="closing">${chapter.closing}</div>` : ""}
            ${finalActions}
          </article>
        </div>
      `;

      pages.appendChild(page);

      if (i === chapters.length - 1) {
        const readAgain = page.querySelector("#readAgain");
        if (readAgain) {
          readAgain.addEventListener("click", () => {
            goTo(0);
          });
        }
      }

      return page;
    }

    const pageEls = chapters.map((_, i) => renderChapter(i));

    chapters.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "progress-dot";
      dot.setAttribute("aria-label", `Chapter ${i + 1}`);
      progress.appendChild(dot);
    });

    /* =========================================================
       TYPEWRITER EFFECT
       ========================================================= */

    function typewriter(element) {
      const html = element.innerHTML;
      const plain = element.textContent;
      element.innerHTML = "";
      element.dataset.originalHtml = html;
      element.dataset.plain = plain;

      return new Promise(resolve => {
        let cursor = 0;

        const interval = setInterval(() => {
          if (cursor >= plain.length) {
            clearInterval(interval);
            element.innerHTML = html;
            resolve();
            return;
          }

          cursor += 1;
          element.textContent = plain.slice(0, cursor);
        }, 12);
      });
    }

    async function typeCurrentChapter(i) {
      const page = pageEls[i];
      const targets = [...page.querySelectorAll(".type-target")];

      for (const target of targets) {
        await typewriter(target);
      }
    }

    /* =========================================================
       PAGE TRANSITIONS
       ========================================================= */

    async function goTo(index) {
      if (index < 0 || index >= chapters.length || index === current) return;

      const oldPage = pageEls[current];
      const newPage = pageEls[index];

      oldPage.classList.remove("active");
      newPage.classList.add("active");

      current = index;
      localStorage.setItem("queenieRickyChapter", String(current));

      updateControls();
      burstEffect();
      playChime();

      // Retrigger chapter animation and typewriter
      const targets = [...newPage.querySelectorAll(".type-target")];
      targets.forEach(target => {
        const original = target.dataset.originalHtml || target.innerHTML;
        target.innerHTML = original;
      });

      setTimeout(() => typeCurrentChapter(index), 180);
    }

    function updateControls() {
      pageEls.forEach((page, i) => {
        page.classList.toggle("active", i === current);
      });

      [...progress.children].forEach((dot, i) => {
        dot.classList.toggle("active", i === current);
      });

      prevBtn.disabled = current === 0;

      if (current === chapters.length - 1) {
        nextBtn.textContent = "Restart Story ↺";
        nextBtn.classList.add("primary");
      } else {
        nextBtn.textContent = "Next Chapter →";
        nextBtn.classList.add("primary");
      }

      pageLabel.textContent = `Chapter ${current + 1} of ${chapters.length}`;
    }

    prevBtn.addEventListener("click", () => goTo(current - 1));

    nextBtn.addEventListener("click", () => {
      if (current === chapters.length - 1) {
        goTo(0);
      } else {
        goTo(current + 1);
      }
    });

    /* =========================================================
       TOUCH / SWIPE PAGE TURNING
       ========================================================= */

    let touchStartX = 0;
    let touchStartY = 0;

    document.getElementById("app").addEventListener("touchstart", event => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    document.getElementById("app").addEventListener("touchend", event => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;

      if (Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 1.15) {
        if (dx < 0) {
          if (current < chapters.length - 1) goTo(current + 1);
        } else {
          if (current > 0) goTo(current - 1);
        }
      }
    }, { passive: true });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight" || event.key === " ") {
        event.preventDefault();
        if (current < chapters.length - 1) goTo(current + 1);
      }

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        if (current > 0) goTo(current - 1);
      }

      if (event.key === "Home") {
        event.preventDefault();
        goTo(0);
      }

      if (event.key === "End") {
        event.preventDefault();
        goTo(chapters.length - 1);
      }
    });

    /* =========================================================
       FLOATING HEARTS
       ========================================================= */

    const floatingEmojis = ["💖", "💛", "💫", "🌙", "⭐", "💜"];

    function createFloatingHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = floatingEmojis[Math.floor(Math.random() * floatingEmojis.length)];
      heart.style.setProperty("--left", `${Math.random() * 100}%`);
      heart.style.setProperty("--size", `${14 + Math.random() * 18}px`);
      heart.style.setProperty("--duration", `${8 + Math.random() * 7}s`);
      heart.style.setProperty("--drift", `${-80 + Math.random() * 160}px`);

      hearts.appendChild(heart);
      setTimeout(() => heart.remove(), 17000);
    }

    setInterval(createFloatingHeart, 900);

    for (let i = 0; i < 10; i++) {
      setTimeout(createFloatingHeart, i * 250);
    }

    /* =========================================================
       SHOOTING STARS
       ========================================================= */

    function shootingStar() {
      const star = document.createElement("div");
      star.className = "shooting-star";
      star.style.left = `${45 + Math.random() * 55}%`;
      star.style.top = `${8 + Math.random() * 30}%`;
      shootingStars.appendChild(star);

      setTimeout(() => star.remove(), 1600);
    }

    setInterval(() => {
      if (Math.random() > 0.25) shootingStar();
    }, 17000);

    /* =========================================================
       CHAPTER BURST
       ========================================================= */

    function burstEffect() {
      const symbols = ["💖", "💫", "✨", "💜", "⭐"];

      for (let i = 0; i < 22; i++) {
        const piece = document.createElement("span");
        piece.className = "burst-piece";
        piece.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        piece.style.setProperty("--dx", `${-260 + Math.random() * 520}px`);
        piece.style.setProperty("--dy", `${-260 + Math.random() * 520}px`);
        piece.style.setProperty("--rotate", `${-180 + Math.random() * 360}deg`);
        burst.appendChild(piece);

        setTimeout(() => piece.remove(), 1500);
      }
    }

    /* =========================================================
       SOFT SYNTHESIZED AMBIENT SOUND
       ========================================================= */

    let audioContext = null;
    let soundEnabled = true;

    function ensureAudio() {
      if (!soundEnabled) return false;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return false;

        if (!audioContext) {
          audioContext = new AudioContext();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        return true;
      } catch {
        return false;
      }
    }

    function tone(freq, duration, delay, volume) {
      if (!ensureAudio()) return;

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = "sine";
      osc.frequency.value = freq;

      osc.connect(gain);
      gain.connect(audioContext.destination);

      const start = audioContext.currentTime + delay;

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(volume, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      osc.start(start);
      osc.stop(start + duration + 0.03);
    }

    function playChime() {
      if (!soundEnabled) return;

      tone(523.25, 0.17, 0.00, 0.022);
      tone(659.25, 0.18, 0.08, 0.018);
      tone(783.99, 0.26, 0.17, 0.015);
    }

    function playAmbient() {
      if (!ensureAudio()) return;

      // Gentle, one-shot chord on first interaction.
      tone(261.63, 1.8, 0.00, 0.007);
      tone(329.63, 1.8, 0.18, 0.006);
      tone(392.00, 2.0, 0.36, 0.005);
    }

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "♪ Sound" : "♪ Muted";

      if (soundEnabled) {
        playAmbient();
        playChime();
      }
    });

    /* =========================================================
       START
       ========================================================= */

    updateControls();
    pageEls[current].classList.add("active");

    // Type the first page only after a small cinematic delay.
    setTimeout(() => {
      typeCurrentChapter(current);
    }, 450);

    // First click anywhere starts the soft ambient sound.
    let ambientStarted = false;

    function startAmbientOnce() {
      if (ambientStarted) return;
      ambientStarted = true;
      playAmbient();
    }

    document.addEventListener("pointerdown", startAmbientOnce, { once: true });

    // If the page is resumed after being hidden, continue normally.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && soundEnabled && audioContext?.state === "suspended") {
        audioContext.resume().catch(() => {});
      }
    });
  </script>
</body>
</html>
